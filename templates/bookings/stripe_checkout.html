{% extends 'base/base.html' %}

{% block content %}
<div class="sp-stripe-wrapper">
    <div class="sp-stripe-card">

        <!-- Header -->
        <div class="sp-card-header text-center mb-4">
            <span class="sp-badge mb-2">Secure Payment Gateway</span>
            <h3 class="sp-title">Stripe Card Checkout</h3>
            <p class="sp-subtitle">Booking #{{ booking.id }}</p>
            
            <div class="sp-amount-box mt-3">
                <span class="sp-amount-label">Amount To Pay</span>
                <h2 class="sp-amount-value">PKR {{ payment.amount }}</h2>
            </div>
        </div>

        <!-- Test Mode Banner -->
        <div class="sp-test-alert mb-4">
            <div class="sp-alert-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f5132" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            </div>
            <div>
                <strong>Test Mode Card:</strong> Use <code>4242 4242 4242 4242</code> with any future expiry date and CVC.
            </div>
        </div>

        <!-- Payment Form -->
        <form id="payment-form">
            <div id="payment-element" class="mb-4"></div>
            
            <div id="payment-message" class="sp-error-message d-none mb-3"></div>

            <button id="submit-btn" class="sp-submit-btn">
                <span id="btn-text">Pay PKR {{ payment.amount }}</span>
                <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
            </button>
        </form>

        <div class="sp-security-footer text-center mt-4">
            <small>🔒 Encrypted 256-bit SSL Payment Processing</small>
        </div>

    </div>
</div>

<style>
    /* Navbar Clearance Padding (110px Top Padding Fix) */
    .sp-stripe-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 110px 15px 50px 15px;
        box-sizing: border-box;
    }

    .sp-stripe-card {
        width: 100%;
        max-width: 580px;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 36px 28px;
        box-shadow: 0 10px 25px -5px rgba(15, 81, 50, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .sp-badge {
        display: inline-block;
        background-color: #e6f4ea;
        color: #0f5132;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        padding: 4px 14px;
        border-radius: 50px;
    }

    .sp-title {
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 2px;
        font-size: 1.6rem;
    }

    .sp-subtitle {
        color: #64748b;
        font-size: 0.92rem;
        margin: 0;
    }

    .sp-amount-box {
        background-color: #f8fafc;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        padding: 12px;
        display: inline-block;
        min-width: 220px;
    }

    .sp-amount-label {
        display: block;
        font-size: 0.75rem;
        color: #64748b;
        text-transform: uppercase;
        font-weight: 600;
    }

    .sp-amount-value {
        color: #0f5132;
        font-weight: 800;
        margin: 0;
        font-size: 1.5rem;
    }

    .sp-test-alert {
        background-color: #f0fdf4;
        border: 1px solid #bbf7d0;
        color: #166534;
        border-radius: 10px;
        padding: 12px 16px;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .sp-test-alert code {
        background-color: #dcfce7;
        padding: 2px 6px;
        border-radius: 4px;
        color: #0f5132;
        font-weight: 700;
    }

    .sp-submit-btn {
        width: 100%;
        background-color: #0f5132;
        color: #ffffff;
        font-weight: 700;
        font-size: 1.05rem;
        padding: 13px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        box-shadow: 0 4px 12px rgba(15, 81, 50, 0.25);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .sp-submit-btn:hover {
        background-color: #0b3d26;
        box-shadow: 0 6px 16px rgba(15, 81, 50, 0.35);
        transform: translateY(-1px);
    }

    .sp-submit-btn:disabled {
        background-color: #94a3b8;
        cursor: not-allowed;
        box-shadow: none;
        transform: none;
    }

    .sp-error-message {
        background-color: #fef2f2;
        border: 1px solid #fecaca;
        color: #dc2626;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 0.88rem;
    }

    .sp-security-footer small {
        color: #64748b;
        font-size: 0.8rem;
    }

    @media (max-width: 576px) {
        .sp-stripe-wrapper {
            padding-top: 120px;
        }
        .sp-stripe-card {
            padding: 24px 18px;
        }
    }
</style>

<script src="https://js.stripe.com/v3/"></script>
<script>
    const stripe = Stripe("{{ stripe_publishable_key }}");
    const clientSecret = "{{ client_secret }}";
    
    const appearance = {
        theme: 'stripe',
        variables: {
            colorPrimary: '#0f5132',
            colorBackground: '#ffffff',
            colorText: '#0f172a',
            colorDanger: '#dc2626',
            fontFamily: 'system-ui, -apple-system, sans-serif',
            spacingUnit: '4px',
            borderRadius: '8px',
        },
    };

    const elements = stripe.elements({ clientSecret, appearance });
    const paymentElement = elements.create("payment");
    paymentElement.mount("#payment-element");

    const form = document.getElementById("payment-form");
    const submitBtn = document.getElementById("submit-btn");
    const btnText = document.getElementById("btn-text");
    const btnSpinner = document.getElementById("btn-spinner");
    const messageBox = document.getElementById("payment-message");

    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        btnText.classList.add("d-none");
        btnSpinner.classList.remove("d-none");
        messageBox.classList.add("d-none");

        const { error, paymentIntent } = await stripe.confirmPayment({
            elements,
            redirect: "if_required",
        });

        if (error) {
            messageBox.textContent = error.message;
            messageBox.classList.remove("d-none");
            submitBtn.disabled = false;
            btnText.classList.remove("d-none");
            btnSpinner.classList.add("d-none");
            return;
        }

        const response = await fetch("{% url 'bookings:confirm_stripe_payment' booking.id %}", {
            method: "POST",
            headers: {
                "X-CSRFToken": getCookie("csrftoken"),
                "Content-Type": "application/json",
            },
        });
        const result = await response.json();

        if (result.success) {
            window.location.href = result.redirect_url;
        } else {
            messageBox.textContent = result.error || "Payment verification failed. Please try again.";
            messageBox.classList.remove("d-none");
            submitBtn.disabled = false;
            btnText.classList.remove("d-none");
            btnSpinner.classList.add("d-none");
        }
    });
</script>
{% endblock %}
