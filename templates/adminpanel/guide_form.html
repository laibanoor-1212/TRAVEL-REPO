{% extends 'adminpanel/base_admin.html' %}

{% block content %}
<h2>Edit Guide Page: {{ guide.title|default:slug }}</h2>

<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    
    <!-- Form Fields rendering (including CKEditor) -->
    {{ form.media }}
    {{ form.as_p }}

    <button type="submit" class="btn btn-success">Save Changes</button>
    <a href="{% url 'adminpanel:guide_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
