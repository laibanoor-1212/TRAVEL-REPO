{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/forget_password.css' %}">
</head>
<body>

<div class="background"></div>
<div class="container">
    <div class="card">
        <h2>Forgot password?</h2>
        <p>We’ll send you updated instructions shortly.</p>

        <!-- Django Alerts / Messages -->
        {% if messages %}
            {% for message in messages %}
                <p style="color: green; font-weight: bold;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <!-- Check 1 & Check 2: method="POST" aur action -->
        <form method="POST" action="{% url 'accounts:forget_password' %}">
            <!-- Check 3: CSRF Token -->
            {% csrf_token %}
            
            <label>Email</label>
            <!-- Check 4: name="email" attribute LAZMI hona chahiye -->
            <input type="email" name="email" placeholder="Enter your email" required>
            
            <button type="submit">Reset password</button>
        </form>

    </div>
</div>

</body>
</html>
