{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password - Safar-e-Haram</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;">

    <div style="background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px;">
        <h2 style="margin-top: 0; color: #333;">Set New Password</h2>
        <p style="color: #666; font-size: 14px;">Enter your new password below to reset your account credentials.</p>

        {% if messages %}
            {% for message in messages %}
                <div style="padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 14px; background-color: #fee2e2; color: #991b1b;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div style="margin-bottom: 15px;">
                <label for="password" style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">New Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter new password" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div style="margin-bottom: 20px;">
                <label for="confirm_password" style="display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px;">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="Confirm new password" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
            </div>

            <button type="submit" style="width: 100%; background-color: #065f46; color: #ffffff; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer;">
                Reset Password
            </button>
        </form>
    </div>

</body>
</html>
