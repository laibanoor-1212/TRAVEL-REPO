{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/forget_password_invalid.css' %}">
</head>
<body>
<div class="background" style="pointer-events: none;"></div>

<div class="container" style="position: relative; z-index: 10;">
    <div class="card" style="position: relative; z-index: 11;">
        <div class="icon error">!</div>
        <h2>Forgot Password</h2>
        <p>Enter your email to receive reset instructions</p>

        <div class="error-box">
            Invalid email or account not found
        </div>

        <form method="POST">
            {% csrf_token %}
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required style="position: relative; z-index: 12;">
            <button type="submit">Try Again</button>
        </form>

    </div>
</div>

</body>
</html>
